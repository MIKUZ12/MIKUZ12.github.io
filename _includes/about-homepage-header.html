<style>
    @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Arial+Rounded+MT+Bold&display=swap');

    body,
    .page__content,
    .sidebar,
    .author__name {
        font-family: 'Arial Rounded MT Bold', 'Verdana', sans-serif !important;
        font-size: 15px;
        font-weight: normal;
    }

    /* Only headings and explicitly bold elements use the bold weight */
    .page__content p,
    .page__content li,
    .page__content i,
    .page__content span:not(.self-author):not(.pub-venue):not(.profile-list__title):not(.profile-list__date),
    .experience-info,
    .publication-card > .publication-card__layout > div,
    .pub-meta-row {
        font-weight: normal;
    }

    .main-heading {
        font-family: 'Permanent Marker', cursive;
        text-align: center;
        color: var(--section-title, #c87d5e);
        margin-bottom: 1.5rem;
    }
    .profile-list-section {
        --profile-accent: #c97e5e;
        --profile-accent-rgb: 201, 126, 94;
        margin: 8px 0 26px;
    }
    .profile-list-section--awards {
        --profile-accent: #c97e5e;
        --profile-accent-rgb: 201, 126, 94;
    }
    .profile-list-section--news {
        max-height: 220px;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        padding: 8px;
        background: rgba(249, 247, 244, 0.82);
        border: 1px solid rgba(201, 126, 94, 0.12);
        border-radius: 8px;
        scrollbar-width: thin;
        scrollbar-color: rgba(201, 126, 94, 0.55) transparent;
    }
    .profile-list-section--news::-webkit-scrollbar { width: 7px; }
    .profile-list-section--news::-webkit-scrollbar-track { background: transparent; }
    .profile-list-section--news::-webkit-scrollbar-thumb {
        background: rgba(201, 126, 94, 0.55);
        border-radius: 999px;
    }
    .profile-list {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
    }
    .profile-list__item {
        position: relative;
        display: grid;
        grid-template-columns: minmax(80px, max-content) minmax(0, 1fr);

        align-items: center;
        margin: 0;

    .profile-list__item::before {

        inset: 0 auto 0 0;
        width: 3px;
        background: var(--profile-accent);
        opacity: 0.72;
    }
    .profile-list__date {
        color: var(--profile-accent);

        margin: 8px 0 26px;

        background: #f9f9f9;

    .publication-card.featured:hover { box-shadow: 0 8px 16px rgba(200,125,94,0.16); }

        height: 120px;
        object-fit: contain;
        margin-right: 20px;
        border-radius: 8px;

        background: #fff;
        border: 1px solid #f0ede9;
    }
    .self-author { color: #8f1d2c; font-weight: 900; }
    .pub-meta-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px 11px;
        margin-top: 5px;
        line-height: 1.35;
    }
    .pub-venue { color: #83a1c7; font-style: italic; font-weight: 700; white-space: nowrap; }

        display: inline-flex;
        align-items: center;
        gap: 0.35em;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 650;
        background: rgba(107,114,128,0.08);
        color: #6b7280;
        border: 1px solid transparent;
        white-space: nowrap;
    }
    .pub-badge::before { content: ""; width: 0.45em; height: 0.45em; border-radius: 999px; background: currentColor; opacity: 0.75; }
    .pub-links { display: inline-flex; align-items: center; gap: 9px; }
    .pub-links a { white-space: nowrap; }
    .pub-body { display: flex; flex-direction: column; gap: 0; min-width: 0; }
    .pub-body p { margin: 0 0 0.45rem 0; line-height: 1.5; }
    .pub-body p:last-child { margin-bottom: 0; }
    .pub-title { font-weight: normal; }
    .pub-title strong { font-weight: bold; }
    .pub-authors { font-size: 0.88rem; color: #6b7280; font-weight: normal; }
    .pub-desc { font-weight: normal; font-size: 0.93rem; color: #5f6368; }
    .pub-note { font-size: 0.82rem; color: #9a9ea5; font-weight: normal; }

        .main-heading { font-size: clamp(1.55rem, 7vw, 2rem); line-height: 1.25; margin-bottom: 1.25rem; }

        .experience-card { align-items: flex-start; }
        .experience-logo { width: 52px; height: 52px; flex-basis: 52px; margin-right: 14px; }

        .profile-list__item { grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 9px 10px 9px 16px; }
        .profile-list__date { font-size: 0.78rem; }
        .profile-list__title { font-size: 0.92rem; }
        .profile-list__meta { font-size: 0.82rem; }
    }
</style>
